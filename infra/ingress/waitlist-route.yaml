# The waitlist page (ARCHITECTURE.md, decisions 86 and 123), while sign-up
# on the hosted service is closed, at a host of its own: WAITLIST_DOMAIN is
# `openupstream.com` for the hosted service, whose dashboard, madAuth and
# API are at `console.openupstream.com` (platform-routes.yaml). Every path
# of the host goes to the control plane's waitlist port. Applied by
# infra/dev-cluster/platform.sh with SIGNUP=closed only, and removed again
# with SIGNUP=open. It uses the hsts, retry and madAuth rate-limit Middlewares and
# the ServersTransport of platform-routes.yaml; CLUSTER_ISSUER as there.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: waitlist
  namespace: project-00000000-0000-4000-8000-000000000002
spec:
  secretName: waitlist-tls
  issuerRef: {kind: ClusterIssuer, name: CLUSTER_ISSUER}
  dnsNames: [WAITLIST_DOMAIN]
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: waitlist-rate-limit
  namespace: project-00000000-0000-4000-8000-000000000002
spec:
  # Per IP: a few form posts a minute. Each address also gets at most one
  # e-mail an hour, so the form cannot be used to flood a mailbox.
  rateLimit:
    average: 5
    period: 1m
    burst: 5
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: waitlist
  namespace: project-00000000-0000-4000-8000-000000000002
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`WAITLIST_DOMAIN`) && (Method(`GET`) || Method(`HEAD`))
      kind: Rule
      middlewares: [{name: hsts}, {name: madauth-rate-limit}, {name: retry-other-pod}]
      services: [{name: control-plane, port: 8082, serversTransport: fail-fast}]
    - match: Host(`WAITLIST_DOMAIN`)
      kind: Rule
      middlewares: [{name: hsts}, {name: waitlist-rate-limit}]
      services: [{name: control-plane, port: 8082, serversTransport: fail-fast}]
  tls: {secretName: waitlist-tls}
