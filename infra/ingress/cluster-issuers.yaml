# Let's Encrypt, with DNS-01 on bunny.net through the webhook (decision 69):
# it covers wildcards and needs no route to the cluster. Staging for dev
# clusters (decision 70), production for the real one.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef: {name: letsencrypt-staging-account}
    solvers:
      - dns01:
          webhook:
            groupName: acme.openupstream.com
            solverName: bunny
            config: {secretRef: bunny-api, secretNamespace: cert-manager}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef: {name: letsencrypt-account}
    solvers:
      - dns01:
          webhook:
            groupName: acme.openupstream.com
            solverName: bunny
            config: {secretRef: bunny-api, secretNamespace: cert-manager}
