# Garage, our object storage (ARCHITECTURE.md, "Object storage"; decision
# 83): one node per Site, replication factor 3, so every object is stored
# once in each Site. The nodes find each other through Kubernetes
# (GarageNode objects in this namespace); the layout, which zone each node
# is, is assigned once by infra/dev-cluster/garage.sh.
#
# Filled in when applied: CUSTOMER_DOMAIN (`openupstream.app` in
# production, `dev.openupstream.app` on a dev cluster) and GARAGE_DATA_SIZE,
# each node's data volume (e.g. `20Gi`). Needs the Secret
# garage with GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN, which Garage reads
# from its environment.
apiVersion: v1
kind: Namespace
metadata:
  name: garage
---
# What Garage's Kubernetes discovery publishes: one object per node, named
# by its node id. Garage would create this definition itself, but that
# needs the right to create any CustomResourceDefinition; it is installed
# here instead and Garage is told to skip it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: garagenodes.deuxfleurs.fr
spec:
  group: deuxfleurs.fr
  names: {kind: GarageNode, plural: garagenodes, singular: garagenode}
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [hostname, address, port]
              properties:
                hostname: {type: string}
                address: {type: string}
                port: {type: integer, minimum: 0, maximum: 65535}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage
  namespace: garage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage-discovery
  namespace: garage
rules:
  - apiGroups: [deuxfleurs.fr]
    resources: [garagenodes]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-discovery
  namespace: garage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: garage-discovery
subjects:
  - kind: ServiceAccount
    name: garage
    namespace: garage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: garage
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "lmdb"
    metadata_auto_snapshot_interval = "6h"

    # One copy per Site; reads and writes need two of three (quorum), so
    # they keep working while any one Site is down.
    replication_factor = 3
    consistency_mode = "consistent"
    compression_level = 1

    rpc_bind_addr = "[::]:3901"

    [kubernetes_discovery]
    namespace = "garage"
    service_name = "garage"
    skip_crd = true

    # Virtual-hosted style only: <bucket>.s3.CUSTOMER_DOMAIN (decision 82).
    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.CUSTOMER_DOMAIN"

    [admin]
    api_bind_addr = "[::]:3903"
---
# The nodes' stable names, for the StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: garage-headless
  namespace: garage
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: garage}
  ports:
    - {name: rpc, port: 3901}
---
# The S3 API (behind Traefik) and the admin API (for the control plane
# only), on any node: every node answers for every bucket.
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: garage
spec:
  selector: {app.kubernetes.io/name: garage}
  ports:
    - {name: s3, port: 3900, targetPort: s3}
    - {name: admin, port: 3903, targetPort: admin}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: garage
  labels: {app.kubernetes.io/name: garage}
spec:
  replicas: 3
  serviceName: garage-headless
  # The nodes start together; Garage waits for its peers on its own.
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app.kubernetes.io/name: garage}
  template:
    metadata:
      labels: {app.kubernetes.io/name: garage}
    spec:
      serviceAccountName: garage
      # One node per Site, the third Site included.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels: {app.kubernetes.io/name: garage}
      tolerations:
        - {key: openupstream.io/third-site, operator: Exists, effect: NoSchedule}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: garage
          image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
          envFrom:
            - secretRef: {name: garage}
          ports:
            - {name: s3, containerPort: 3900}
            - {name: rpc, containerPort: 3901}
            - {name: admin, containerPort: 3903}
          readinessProbe:
            httpGet: {path: /health, port: admin}
            periodSeconds: 10
          volumeMounts:
            - {name: config, mountPath: /etc/garage.toml, subPath: garage.toml}
            - {name: meta, mountPath: /var/lib/garage/meta}
            - {name: data, mountPath: /var/lib/garage/data}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: config
          configMap: {name: garage-config}
  volumeClaimTemplates:
    - metadata: {name: meta}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: GARAGE_DATA_SIZE}}
