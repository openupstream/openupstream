# Garage, our object storage (ARCHITECTURE.md, "Object storage"; decision
# 83): one node per Site, replication factor 3, so every object is stored
# once in each Site. The nodes find each other through Kubernetes
# (GarageNode objects in this namespace); the layout, which zone each node
# is, is assigned once by infra/dev-cluster/garage.sh.
#
# Filled in when applied: CUSTOMER_DOMAIN (`openupstream.app` in
# production, `dev.openupstream.app` on a dev cluster), GARAGE_DATA_SIZE,
# each node's data volume (e.g. `20Gi`), and GARAGE_NODES, the number of
# nodes and copies (3; 1 on a single-node dev cluster, decision 112). Needs
# the Secret garage with GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN, which
# Garage reads from its environment.
apiVersion: v1
kind: Namespace
metadata:
  name: garage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage
  namespace: garage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage-discovery
  namespace: garage
rules:
  - apiGroups: [deuxfleurs.fr]
    resources: [garagenodes]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-discovery
  namespace: garage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: garage-discovery
subjects:
  - kind: ServiceAccount
    name: garage
    namespace: garage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: garage
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "lmdb"
    metadata_auto_snapshot_interval = "6h"

    # One copy per Site; reads and writes need two of three (quorum), so
    # they keep working while any one Site is down. garage.sh sets it: 3, or
    # 1 on a single-node dev cluster (decision 112).
    replication_factor = GARAGE_NODES
    consistency_mode = "consistent"
    compression_level = 1

    rpc_bind_addr = "[::]:3901"

    [kubernetes_discovery]
    namespace = "garage"
    service_name = "garage"
    skip_crd = true

    # Virtual-hosted style only: <bucket>.s3.CUSTOMER_DOMAIN (decision 82).
    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.CUSTOMER_DOMAIN"

    # Static sites (decision 84): Traefik sends a Domain's Routes here with
    # the Bucket's name as the Host header, which Garage looks up as the
    # Bucket's global alias. Never routed directly.
    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".web.garage.internal"

    [admin]
    api_bind_addr = "[::]:3903"
---
# nginx in front of Garage's S3 API for requests that come through Traefik
# (ARCHITECTURE.md, "Object storage"; decision 134). Traefik, as every
# proxy built on Go's HTTP client, leaves out `Content-Length: 0` when a
# request has no body. Clients that sign the header (`aws s3 rm`, `aws s3
# sync --delete`, the MinIO client) are then refused by Garage, which wants
# every signed header present. nginx puts it back: a request without
# Content-Length and without Transfer-Encoding has no body, so its length
# is 0, signed or not. Everything else passes as it came: the URI in its
# original form (no URI on proxy_pass), the Host, every header, bodies
# unbuffered. Retries and timeouts stay Traefik's.
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-s3-proxy
  namespace: garage
data:
  nginx.conf: |
    worker_processes 2;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events {
      worker_connections 1024;
    }
    http {
      access_log off;
      server_tokens off;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;

      # No Content-Length and no Transfer-Encoding: no body, length 0.
      # With a Transfer-Encoding the value is empty, and nginx sets no header.
      map "$http_content_length$http_transfer_encoding" $garage_content_length {
        ""      0;
        default $http_content_length;
      }

      upstream garage {
        server 127.0.0.1:3900;
        keepalive 32;
      }

      server {
        listen [::]:3905 ipv6only=off;
        # Longer than Traefik keeps an idle connection (90 s), so it is
        # Traefik that closes one, never nginx under a request on its way.
        keepalive_timeout 300s;
        # Headers and sizes are Garage's to judge, not nginx's.
        client_max_body_size 0;
        ignore_invalid_headers off;
        underscores_in_headers on;
        large_client_header_buffers 4 32k;

        location / {
          proxy_pass http://garage;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header Host $http_host;
          proxy_set_header Content-Length $garage_content_length;
          proxy_request_buffering off;
          proxy_buffering off;
          # Traefik cuts a request after 60 s (its readTimeout); these are above it.
          proxy_read_timeout 120s;
          proxy_send_timeout 120s;
        }
      }
    }
---
# The nodes' stable names, for the StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: garage-headless
  namespace: garage
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: garage}
  ports:
    - {name: rpc, port: 3901}
---
# The S3 API and the website endpoint (behind Traefik) and the admin API
# (for the control plane only), on any node: every node answers for every
# bucket. `s3-public` is the S3 API through nginx, for Traefik's S3 route;
# `s3` is Garage itself, for the control plane and Loki, whose clients come
# through no proxy.
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: garage
spec:
  selector: {app.kubernetes.io/name: garage}
  ports:
    - {name: s3, port: 3900, targetPort: s3}
    - {name: s3-public, port: 3905, targetPort: s3-public}
    - {name: web, port: 3902, targetPort: web}
    - {name: admin, port: 3903, targetPort: admin}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: garage
  labels: {app.kubernetes.io/name: garage}
spec:
  replicas: GARAGE_NODES
  serviceName: garage-headless
  # The nodes start together; Garage waits for its peers on its own.
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app.kubernetes.io/name: garage}
  template:
    metadata:
      labels: {app.kubernetes.io/name: garage}
      # `kubectl exec` and `logs` mean Garage unless they name the other container.
      annotations: {kubectl.kubernetes.io/default-container: garage}
    spec:
      serviceAccountName: garage
      # One node per Site, the third Site included.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels: {app.kubernetes.io/name: garage}
      tolerations:
        - {key: openupstream.io/third-site, operator: Exists, effect: NoSchedule}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: garage
          image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
          envFrom:
            - secretRef: {name: garage}
          ports:
            - {name: s3, containerPort: 3900}
            - {name: rpc, containerPort: 3901}
            - {name: web, containerPort: 3902}
            - {name: admin, containerPort: 3903}
          readinessProbe:
            httpGet: {path: /health, port: admin}
            periodSeconds: 10
          volumeMounts:
            - {name: config, mountPath: /etc/garage.toml, subPath: garage.toml}
            - {name: meta, mountPath: /var/lib/garage/meta}
            - {name: data, mountPath: /var/lib/garage/data}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
        # See the ConfigMap garage-s3-proxy above. Ready only with Garage:
        # the Service's endpoints are per pod, so a pod whose Garage is not
        # ready gets no S3 requests on either port.
        - name: s3-proxy
          image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
          ports:
            - {name: s3-public, containerPort: 3905}
          readinessProbe:
            tcpSocket: {port: s3-public}
            periodSeconds: 10
          volumeMounts:
            - {name: s3-proxy, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf}
            - {name: s3-proxy-tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: config
          configMap: {name: garage-config}
        - name: s3-proxy
          configMap: {name: garage-s3-proxy}
        - name: s3-proxy-tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: {name: meta}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: GARAGE_DATA_SIZE}}
