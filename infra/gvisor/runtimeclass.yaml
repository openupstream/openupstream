# Customer containers run under gVisor (ARCHITECTURE.md, "Containers"):
# the Services operator sets runtimeClassName: gvisor on every pod. Only the
# compute nodes have runsc (install.sh) and carry the label below, so a pod
# of this class is never scheduled where it cannot start.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
scheduling:
  nodeSelector:
    openupstream.io/gvisor: "true"
