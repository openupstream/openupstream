# Customer containers run under gVisor (ARCHITECTURE.md, "Containers"):
# the Services operator sets runtimeClassName: gvisor on every pod. Only the
# compute nodes have runsc (install.sh) and carry the label below, so a pod
# of this class is never scheduled where it cannot start.
#
# The overhead is what gVisor itself takes per pod (its Sentry and gofer),
# so the scheduler reserves it next to the container's own memory: measured
# on the dev cluster (2026-10-31) at 50-60 MB RSS with a small HTTP server.
# It is reserved, not billed; the customer pays for the limit they chose.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
overhead:
  podFixed: {memory: 64Mi, cpu: 10m}
scheduling:
  nodeSelector:
    openupstream.io/gvisor: "true"
