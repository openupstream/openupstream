# The platform's own alerts, on top of kube-prometheus-stack's defaults
# (nodes, disks, the Kubernetes API, workloads in the platform's
# namespaces). ARCHITECTURE.md, "Observability and customer logs".
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openupstream
  namespace: monitoring
spec:
  groups:
    - name: databases
      rules:
        - alert: DatabaseInstanceDown
          expr: up{job="monitoring/cnpg-instances"} == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: Postgres instance {{ $labels.pod }} in {{ $labels.namespace }} does not answer
            description: Its metrics have not been scraped for 5 minutes; the Database may run on one instance only.
        - alert: DatabaseMissingStandby
          # Every Database runs a primary and a standby, in two compute
          # Sites (decision 26, ADR-0007).
          # monitoring.sh fills in DATABASE_INSTANCES: 2, or 1 on a
          # single-node dev cluster, where this never fires (decision 112).
          expr: count by (namespace, cluster) (up{job="monitoring/cnpg-instances"} == 1) < DATABASE_INSTANCES
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: Database {{ $labels.cluster }} in {{ $labels.namespace }} has fewer than two instances up
            description: A Site failure now loses it until a standby is back.
        - alert: DatabaseReplicationLag
          expr: max by (namespace, cluster) (cnpg_pg_replication_lag) > 60
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: Standby of {{ $labels.cluster }} in {{ $labels.namespace }} is {{ $value | humanizeDuration }} behind
            description: A failover now would lose that much of the last writes.
        - alert: DatabaseWalNotArchived
          # Archiving keeps failing and nothing gets through: point-in-time
          # restore falls behind. On a quiet Database few WAL files pile up,
          # so the failures count, not the backlog. On the dev cluster the
          # platform Databases always fire this (their archive path is
          # reused; infra/dev-cluster/README.md).
          expr: |
            max by (namespace, cluster) (
              increase(cnpg_pg_stat_archiver_failed_count[15m]) > 0
              unless increase(cnpg_pg_stat_archiver_archived_count[15m]) > 0
            )
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: Database {{ $labels.cluster }} in {{ $labels.namespace }} cannot archive its WAL
            description: Every archive attempt in the last 15 minutes failed; backups and point-in-time restore fall behind.
        - alert: DatabaseVolumeFull
          # Storage grows by itself at 90% (decision 111), so a volume past
          # 95% for long has not: auto-grow is off, at the customer's
          # maximum, the Account is held, or the node has no room. At 100%
          # Postgres stops writing. Also fires for a runaway writer that
          # auto-grow keeps up with until the node is full.
          expr: |
            max by (namespace, persistentvolumeclaim) (
              kubelet_volume_stats_used_bytes{namespace=~"project-.*", persistentvolumeclaim=~"db-.*"}
              / kubelet_volume_stats_capacity_bytes{namespace=~"project-.*", persistentvolumeclaim=~"db-.*"}
            ) > 0.95
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: Database volume {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} is {{ $value | humanizePercentage }} full
            description: It did not grow by itself; check its auto-grow setting and maximum, the Account's Holds and the node's free space (the control plane logs `growth:`).
        - alert: DatabaseVolumeResizeFailed
          # A grow the API or the growth pass accepted that TopoLVM could not
          # carry out (two requests took the same room): the PVC asks for
          # more than its filesystem has (normally within 1%), and the
          # Database reads `resizing`. kube-state-metrics has no PVC
          # condition metric here, so the sizes are compared.
          expr: |
            max by (namespace, persistentvolumeclaim) (
              kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace=~"project-.*", persistentvolumeclaim=~"db-.*"}
              / on (namespace, persistentvolumeclaim) kubelet_volume_stats_capacity_bytes
            ) > 1.05
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: Database volume {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} has not grown to its size
            description: The PVC asks for {{ $value | humanizePercentage }} of what its filesystem has; TopoLVM most likely lacks room on the node and retries once there is.
    - name: object-storage
      rules:
        - alert: GarageUnhealthy
          expr: max(cluster_healthy) == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: Garage reports the cluster unhealthy
            description: Some partitions have no write quorum; Buckets may refuse writes.
        - alert: GarageNodeDown
          expr: min(cluster_storage_nodes_ok) < max(cluster_storage_nodes)
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "{{ $value }} of Garage's storage nodes are up"
            description: Objects keep fewer than three copies until the node is back.
    - name: certificates
      # The platform's own Certificates only: a customer's custom domain
      # fails when they move its DNS away, which is theirs to see in the
      # domain's status, not ours to be woken for. Same namespace list as
      # defaultRules.appNamespacesTarget.
      rules:
        - alert: CertificateExpiresSoon
          expr: certmanager_certificate_expiration_timestamp_seconds{namespace=~"kube-system|monitoring|traefik|cert-manager|cnpg-system|garage|openupstream-system|project-00000000-0000-4000-8000-000000000002"} - time() < 14 * 24 * 3600
          for: 1h
          labels: {severity: warning}
          annotations:
            summary: Certificate {{ $labels.name }} in {{ $labels.namespace }} expires in {{ $value | humanizeDuration }}
            description: cert-manager should have renewed it 30 days before expiry.
        - alert: CertificateNotReady
          expr: max by (namespace, name) (certmanager_certificate_ready_status{condition="False", namespace=~"kube-system|monitoring|traefik|cert-manager|cnpg-system|garage|openupstream-system|project-00000000-0000-4000-8000-000000000002"}) == 1
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: Certificate {{ $labels.name }} in {{ $labels.namespace }} is not ready
            description: Its domain is served without a valid certificate or not at all.
    - name: ingress
      rules:
        - alert: IngressDown
          expr: up{job="monitoring/traefik"} == 0
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: Traefik pod {{ $labels.pod }} does not answer
            description: Its Site serves no traffic until the DNS health check drops it.
    - name: sites
      # The nodes' Site labels (ADR-0007, ADR-0008), checked by the control
      # plane while the cluster runs, with the rules the install's
      # check_sites applies once: one alert per rule. The control plane
      # serves openupstream_site_problem{problem, node, site} from both
      # replicas, so each takes the max. The dashboard's "Sites & nodes"
      # page shows the same problems with the command that fixes each.
      rules:
        - alert: NodeWithoutSite
          expr: max by (node, site) (openupstream_site_problem{problem="node-without-site"}) > 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Node {{ $labels.node }} has no Site"
            description: "It gets no Databases, Services or Jobs. kubectl label node {{ $labels.node }} topology.kubernetes.io/zone=<Site id>, and the compute label or the quorum-only taint (docs/self-hosting.md)."
        - alert: NodeNeitherComputeNorQuorum
          expr: max by (node, site) (openupstream_site_problem{problem="node-neither-compute-nor-quorum"}) > 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Node {{ $labels.node }} is neither labelled compute nor tainted quorum-only"
            description: "Databases, Services and Jobs never run there, other pods may. kubectl label node {{ $labels.node }} openupstream.io/compute-site=true, or kubectl taint node {{ $labels.node }} openupstream.io/quorum-only=true:NoSchedule."
        - alert: NodeComputeAndQuorum
          expr: max by (node, site) (openupstream_site_problem{problem="node-compute-and-quorum"}) > 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Node {{ $labels.node }} is labelled compute but tainted quorum-only"
            description: "Nothing of a compute Site runs there. kubectl taint node {{ $labels.node }} openupstream.io/quorum-only-, or kubectl label node {{ $labels.node }} openupstream.io/compute-site-."
        - alert: SiteMixedCompute
          expr: max by (site) (openupstream_site_problem{problem="site-mixed-compute"}) > 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Only some nodes of Site {{ $labels.site }} are labelled compute"
            description: "kubectl label nodes -l topology.kubernetes.io/zone={{ $labels.site }} openupstream.io/compute-site=true, or openupstream.io/compute-site- on all of them."
        - alert: SiteMixedDefault
          expr: max by (site) (openupstream_site_problem{problem="site-mixed-default"}) > 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Only some nodes of Site {{ $labels.site }} are labelled the default Site"
            description: "kubectl label nodes -l topology.kubernetes.io/zone={{ $labels.site }} openupstream.io/default-site=true, or openupstream.io/default-site- on all of them."
        - alert: DefaultSiteMissing
          expr: max(openupstream_site_problem{problem="default-site-missing"}) > 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "No Site is labelled the default Site"
            description: "New Databases, Services and Jobs without a Home site go to the first compute Site by id. kubectl label nodes -l topology.kubernetes.io/zone=<compute Site> openupstream.io/default-site=true."
        - alert: DefaultSiteNotUnique
          expr: max(openupstream_site_problem{problem="default-site-not-unique"}) > 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "More than one Site is labelled the default Site"
            description: "The first by id is used. Keep one: kubectl label nodes -l topology.kubernetes.io/zone=<Site> openupstream.io/default-site- on the others."
        - alert: DefaultSiteNotCompute
          expr: max by (site) (openupstream_site_problem{problem="default-site-not-compute"}) > 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "The default Site {{ $labels.site }} is no compute Site"
            description: "kubectl label nodes -l topology.kubernetes.io/zone={{ $labels.site }} openupstream.io/default-site-, then label a compute Site's nodes openupstream.io/default-site=true."
        - alert: ComputeSitesBelowTwo
          expr: max(openupstream_site_problem{problem="compute-sites-below-two"}) > 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Fewer than two compute Sites"
            description: "New Databases get no standby in another Site. Label the nodes of another Site openupstream.io/compute-site=true and remove the quorum-only taint from them."
        - alert: SitesBelowThree
          expr: max(openupstream_site_problem{problem="sites-below-three"}) > 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "The nodes are in fewer than three Sites"
            description: "etcd and Garage cannot keep their quorum through the loss of a Site. Join a node of another Site."
        - alert: SiteChecksAbsent
          # No replica of the control plane reports the Site checks: it is
          # down or cannot list the nodes, so the alerts above cannot fire.
          expr: absent(max(openupstream_site_nodes))
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: The control plane reports no Site checks
            description: "Check that the control plane runs and may list the nodes (kubectl auth can-i list nodes --as=system:serviceaccount:project-00000000-0000-4000-8000-000000000002:control-plane)."
