# Loki for the platform's own logs (ARCHITECTURE.md, "Observability and
# customer logs"; decision 106). Never a Project's: Alloy sends only the
# platform's namespaces (alloy-values.yaml), and customer logs are a live
# tail only (decision 21).
#
# Three single-binary replicas, one per Site, the third Site included
# (decision 106), each with its WAL on its node's disk; chunks and index go
# to a bucket in our own Garage (three copies in three Sites). Every stream
# is written to all three and a write needs two, so with any one Site dark
# writes and queries go on and nothing is lost; the dark replica replays its
# WAL when its Site returns. Two replicas were tried and failed: with a
# factor of 1 the dark one's streams refuse writes until it is forgotten,
# and Loki never forgets the last other member (it may be a partition).
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 3
  schemaConfig:
    configs:
      - from: "2026-11-01"
        store: tsdb
        object_store: s3
        schema: v13
        index: {prefix: index_, period: 24h}
  storage:
    type: s3
    # Bucket names customers cannot take: theirs have no dots (BUCKET_NAME).
    bucketNames:
      chunks: openupstream.platform-logs
      ruler: openupstream.platform-logs
      admin: openupstream.platform-logs
    s3:
      endpoint: http://garage.garage.svc:3900
      region: garage
      accessKeyId: ${S3_ACCESS_KEY_ID}
      secretAccessKey: ${S3_SECRET_ACCESS_KEY}
      s3ForcePathStyle: true
      insecure: true
  limits_config:
    # Above the 4 MB/s default: Alloy's first pass ships every log file
    # already on the node at once, and batches it cannot get in are dropped.
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
    retention_period: 336h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: s3

singleBinary:
  replicas: 3
  # S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY, from the Secret monitoring.sh
  # writes with the bucket's own key; expanded into the config above. (The
  # chart's global.extraArgs do not reach this pod.)
  extraArgs: [-config.expand-env=true]
  extraEnvFrom:
    - secretRef: {name: loki-s3}
  # One per Site, the third Site's node too (the chart already keeps one per
  # node). Its etcd must not suffer, so Loki there is held to the limit below.
  tolerations:
    - {key: openupstream.io/third-site, operator: Exists, effect: NoSchedule}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels: {app.kubernetes.io/name: loki, app.kubernetes.io/component: single-binary}
  persistence:
    # Write-ahead log and the chunks not yet flushed; small.
    size: 5Gi
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 1Gi}

# The scalable modes' components, the caches and the self-tests: not used.
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
gateway: {enabled: false}
