# Loki for the platform's own logs (ARCHITECTURE.md, "Observability and
# customer logs"; decision 106). Never a Project's: Alloy sends only the
# platform's namespaces (alloy-values.yaml), and customer logs are a live
# tail only (decision 21).
#
# One single-binary replica. Its chunks and index go to a bucket in our own
# Garage (three copies in three Sites), so a lost pod or Site loses at most
# the last minutes it held in memory; Kubernetes reschedules it.
deploymentMode: SingleBinary

global:
  # S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY, from the Secret monitoring.sh
  # writes with the bucket's own key; expanded into the config below.
  extraArgs: [-config.expand-env=true]
  extraEnvFrom:
    - secretRef: {name: loki-s3}

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2026-11-01"
        store: tsdb
        object_store: s3
        schema: v13
        index: {prefix: index_, period: 24h}
  storage:
    type: s3
    # Bucket names customers cannot take: theirs have no dots (BUCKET_NAME).
    bucketNames:
      chunks: openupstream.platform-logs
      ruler: openupstream.platform-logs
      admin: openupstream.platform-logs
    s3:
      endpoint: http://garage.garage.svc:3900
      region: garage
      accessKeyId: ${S3_ACCESS_KEY_ID}
      secretAccessKey: ${S3_SECRET_ACCESS_KEY}
      s3ForcePathStyle: true
      insecure: true
  limits_config:
    retention_period: 336h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: s3

singleBinary:
  replicas: 1
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - {key: topology.kubernetes.io/zone, operator: In, values: [hetzner-fsn1, ovh-lim]}
  persistence:
    # Write-ahead log and the chunks not yet flushed; small.
    size: 5Gi
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 1Gi}

# The scalable modes' components, the caches and the self-tests: not used.
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
gateway: {enabled: false}
