# Loki for the platform's own logs (ARCHITECTURE.md, "Observability and
# customer logs"; decision 106). Never a Project's: Alloy sends only the
# platform's namespaces (alloy-values.yaml), and customer logs are a live
# tail only (decision 21).
#
# Two single-binary replicas, one per compute Site, each with its WAL on
# its node's disk; chunks and index go to a bucket in our own Garage (three
# copies in three Sites). Each log stream lives in one replica (replication
# factor 1: with 2 of 2 as the write quorum, a factor of 2 would stop all
# writes when either Site is dark). When a replica's Site goes dark, the
# other forgets it after a minute without heartbeats and takes every
# stream; Alloy retries meanwhile. The dark replica's unflushed lines stay
# in its WAL and are flushed when its Site returns.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  ingester:
    autoforget_unhealthy: true
  schemaConfig:
    configs:
      - from: "2026-11-01"
        store: tsdb
        object_store: s3
        schema: v13
        index: {prefix: index_, period: 24h}
  storage:
    type: s3
    # Bucket names customers cannot take: theirs have no dots (BUCKET_NAME).
    bucketNames:
      chunks: openupstream.platform-logs
      ruler: openupstream.platform-logs
      admin: openupstream.platform-logs
    s3:
      endpoint: http://garage.garage.svc:3900
      region: garage
      accessKeyId: ${S3_ACCESS_KEY_ID}
      secretAccessKey: ${S3_SECRET_ACCESS_KEY}
      s3ForcePathStyle: true
      insecure: true
  limits_config:
    # Above the 4 MB/s default: Alloy's first pass ships every log file
    # already on the node at once, and batches it cannot get in are dropped.
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
    retention_period: 336h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: s3

singleBinary:
  replicas: 2
  # S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY, from the Secret monitoring.sh
  # writes with the bucket's own key; expanded into the config above. (The
  # chart's global.extraArgs do not reach this pod.)
  extraArgs: [-config.expand-env=true]
  extraEnvFrom:
    - secretRef: {name: loki-s3}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - {key: topology.kubernetes.io/zone, operator: In, values: [hetzner-fsn1, ovh-lim]}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels: {app.kubernetes.io/name: loki, app.kubernetes.io/component: single-binary}
  persistence:
    # Write-ahead log and the chunks not yet flushed; small.
    size: 5Gi
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 1Gi}

# The scalable modes' components, the caches and the self-tests: not used.
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
gateway: {enabled: false}
