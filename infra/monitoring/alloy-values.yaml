# Grafana Alloy on every node: ships the logs of the platform's own pods to
# Loki (ARCHITECTURE.md, "Observability and customer logs"; decision 106).
# A Project's pods are never collected: decision 21 keeps customer logs a
# live tail only. The namespaces kept here are the same platform list as
# defaultRules.appNamespacesTarget in kube-prometheus-stack-values.yaml.
alloy:
  mounts:
    # /var/log/pods, where the kubelet keeps every container's log.
    varlog: true
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef: {fieldPath: spec.nodeName}
  configMap:
    content: |
      // The pods on this node.
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      // Only the platform's namespaces, never a Project's (decision 21).
      discovery.relabel "platform" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "kube-system|monitoring|traefik|cert-manager|cnpg-system|garage|openupstream-system|project-00000000-0000-4000-8000-000000000002"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.platform.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.cri.receiver]
      }

      // The kubelet's CRI log format: time, stream and flags before the line.
      loki.process "cri" {
        stage.cri {}
        forward_to = [loki.write.loki.receiver]
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
        }
      }

controller:
  type: daemonset
  # Every node: Garage runs on the third Site too.
  tolerations:
    - {key: openupstream.io/third-site, operator: Exists, effect: NoSchedule}
