# The Routes operator: one reconcile pass every 30 s with the routing table
# from the control plane's internal API (ARCHITECTURE.md, decision 84).
# One replica: the pass is idempotent, and a restart in the other Site only
# delays changes to the routing table; Traefik keeps serving what was
# applied.
#
# Needs routes-rbac.yaml. The image is the operators' image, pinned by
# digest, and CLUSTER_ISSUER, the ClusterIssuer of custom domains'
# certificates, are filled in when applied (infra/dev-cluster/platform.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routes-operator
  namespace: openupstream-system
  labels: {app.kubernetes.io/name: routes-operator}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: routes-operator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: routes-operator}
    spec:
      serviceAccountName: routes-operator
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: topology.kubernetes.io/zone, operator: In, values: [hetzner-fsn1, ovh-lim]}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: routes-operator
          image: ghcr.io/openupstream/operators:main
          env:
            - {name: OPERATOR, value: routes}
            - {name: CONTROL_PLANE_URL, value: "http://control-plane.project-00000000-0000-4000-8000-000000000002.svc:8081"}
            - {name: TOKEN_PATH, value: /var/run/secrets/openupstream/control-plane/token}
            - {name: CLUSTER_ISSUER, value: CLUSTER_ISSUER}
          volumeMounts:
            - {name: control-plane-token, mountPath: /var/run/secrets/openupstream/control-plane, readOnly: true}
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        # A token only the control plane accepts (audience), rotated by the
        # kubelet; the operator reads it before every pass.
        - name: control-plane-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: openupstream-control-plane
                  expirationSeconds: 3600
                  path: token
