# What the Database reconcile pass (src/databases/reconcile.ts) may do.
# Server-side apply is a PATCH that creates missing objects, so every applied
# kind needs both `patch` and `create`. Nothing here may delete: removing a
# Database is the control plane's explicit step (ARCHITECTURE.md, decision 48).
# Clusters are also listed: a running one keeps its `shared_buffers` through
# a grow (decision 152), so the pass reads what each asks for now.
#
# Secrets are cluster-wide because Project namespaces are created at run
# time and RBAC cannot select namespaces by name pattern. The same goes for
# a Project's database tunnel (decision 126, src/databases/tunnel.ts): its
# forwarder's Deployment and Service, and the Traefik IngressRoute and
# ForwardAuth Middleware in front of it. The operator never reads the
# callers' role Secrets; the control plane writes them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: databases-operator
  namespace: openupstream-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openupstream-databases-operator
rules:
  - apiGroups: [""]
    resources: [namespaces, secrets, services]
    verbs: [create, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, patch]
  - apiGroups: [traefik.io]
    resources: [ingressroutes, middlewares]
    verbs: [create, patch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, patch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, poolers, scheduledbackups]
    verbs: [create, patch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, poolers]
    verbs: [list]
  # The restart guard (src/databases/pause.ts) reads a primary's pod to see
  # when it serves again, and resumes the Pooler it paused.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  - apiGroups: [barmancloud.cnpg.io]
    resources: [objectstores]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openupstream-databases-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openupstream-databases-operator
subjects:
  - kind: ServiceAccount
    name: databases-operator
    namespace: openupstream-system
---
# The platform's backup credentials, copied into each Project's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openupstream-databases-operator
  namespace: openupstream-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [backup-s3]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openupstream-databases-operator
  namespace: openupstream-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openupstream-databases-operator
subjects:
  - kind: ServiceAccount
    name: databases-operator
    namespace: openupstream-system
