# Serves the dashboard's static export (dashboard/Dockerfile). Traefik is in
# front and adds HSTS; /auth/*, /.well-known/* and /api/* never arrive here
# (infra/ingress/platform-routes.yaml).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Redirects name the path only: the address in front is Traefik's, not this port.
    absolute_redirect off;

    # The session is a cookie, so no other site may put the dashboard in a
    # frame and have the Member click in it.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # Pages are small and name the build's files: always ask again.
    add_header Cache-Control no-cache always;

    # 403 is a path that names a directory: not found, like any other.
    error_page 403 404 =404 /404.html;

    # A page is a file: /project is project.html, and /project/ is the same page.
    rewrite ^/(.+)/$ /$1 permanent;

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Next.js names these files by their content.
    location /_next/static/ {
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
