# The dashboard, as a Service of the platform Project (PLATFORM in
# sdk/src/internal.ts): nginx with the static files of dashboard/Dockerfile
# (ARCHITECTURE.md, decision 123). Two replicas, one per compute Site. It
# talks to nothing: the browser calls madAuth and the API itself, on the
# same host (infra/ingress/platform-routes.yaml routes all three).
#
# The image is pinned by digest when applied (infra/dev-cluster/platform.sh).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard
  namespace: project-00000000-0000-4000-8000-000000000002
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: project-00000000-0000-4000-8000-000000000002
  labels: {app.kubernetes.io/name: dashboard}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: dashboard}
  template:
    metadata:
      labels: {app.kubernetes.io/name: dashboard}
    spec:
      serviceAccountName: dashboard
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: topology.kubernetes.io/zone, operator: In, values: [hetzner-fsn1, ovh-lim]}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels: {app.kubernetes.io/name: dashboard}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: nginx
          image: ghcr.io/openupstream/dashboard:main
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            # nginx's pid file and temporary files.
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: project-00000000-0000-4000-8000-000000000002
spec:
  selector: {app.kubernetes.io/name: dashboard}
  ports:
    - {name: http, port: 8080, targetPort: http}
