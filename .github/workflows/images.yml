name: Images

# Builds the control plane and operators images and pushes them to GHCR,
# tagged with the commit SHA (and `main` on main). Clusters pull them pinned
# by digest (ARCHITECTURE.md, decision 55). Pull requests from forks build
# without pushing.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  image:
    # A branch of this repository is already built on push.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        workspace: [control-plane, operators]
    env:
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.workspace }}/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.workspace }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/{1}:main', github.repository_owner, matrix.workspace) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.workspace }}
          cache-to: type=gha,mode=max,scope=${{ matrix.workspace }}
