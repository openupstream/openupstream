name: Images

# Builds the control plane, operators and demo app images and pushes them to
# GHCR, tagged with the commit SHA (and `main` on main). Clusters pull them
# pinned by digest (ARCHITECTURE.md, decision 55). Pull requests from forks
# build without pushing. A new package is private on GHCR until it is made
# public once in its settings (docs/self-hosting.md).

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  image:
    # A branch of this repository is already built on push.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { image: control-plane, file: control-plane/Dockerfile, app: '' }
          - { image: operators, file: operators/Dockerfile, app: '' }
          - { image: example-notes, file: examples/Dockerfile, app: notes }
    env:
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.app != '' && format('APP={0}', matrix.app) || '' }}
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/{1}:main', github.repository_owner, matrix.image) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
