name: Release sdk

# Publishes @openupstream/sdk to npm when a tag `sdk-v<version>` is pushed,
# e.g. `sdk-v0.1.0` for the version in sdk/package.json (ARCHITECTURE.md,
# decision 80):
#
# - only repository and organization admins may create `sdk-v*` tags (the
#   ruleset "sdk release tags");
# - the job runs in the GitHub Environment `npm-release`, which waits for a
#   maintainer's approval and accepts only `sdk-v*` tags;
# - npm trusted publishing (OIDC) authenticates it, for this workflow in
#   that environment only, so no npm token is stored anywhere; npm records
#   the provenance;
# - every action is pinned to a full commit SHA.

on:
  push:
    tags: ['sdk-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11.20.0
      - run: npm ci
      - name: The tag names the package's version
        run: test "sdk-v$(node -p "require('./sdk/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run build -w sdk
      - name: SDK_VERSION names the same version
        run: node --input-type=module -e "import { SDK_VERSION } from './sdk/dist/index.js'; if ('sdk-v' + SDK_VERSION !== process.env.GITHUB_REF_NAME) { console.error('SDK_VERSION is ' + SDK_VERSION); process.exit(1); }"
      - run: npm test -w sdk
      - run: npm publish -w sdk --provenance
